services:
  - type: web
    name: sena-one
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SQLITE_DB_PATH
        value: /var/data/sena-one.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PHONE
        value: admin
      - key: ADMIN_FULL_NAME
        value: Administrator
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: sena-one-data
      mountPath: /var/data
      sizeGB: 1
